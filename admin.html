<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soap-saa | Order & Fulfillment</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="brand" href="index.html">Soap-saa<small>ORDER MANAGEMENT</small></a><a href="index.html">กลับหน้าร้าน</a></header><main class="admin-wrap"><p class="eyebrow">FULFILLMENT CENTER</p><h1>จัดการออเดอร์ · หยิบ · แพ็ค · จัดส่ง</h1><p class="muted">ข้อมูลคำสั่งซื้อและสต็อกจะอ่านจาก Google Sheets เมื่อเชื่อม Apps Script แล้ว</p><div class="admin-actions"><input id="pin" type="password" placeholder="Admin PIN"><button class="primary" onclick="loadOrders()">โหลดคำสั่งซื้อ</button></div><div id="orders"></div></main><script>
const API_URL="";let ORDERS=[];function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function loadOrders(){const el=document.querySelector('#orders');if(!API_URL){el.innerHTML='<p>ยังไม่ได้ตั้งค่า API_URL ใน admin.html</p>';return}try{let r=await fetch(API_URL+'?action=orders&pin='+encodeURIComponent(document.querySelector('#pin').value));let d=await r.json();if(!d.ok)throw Error(d.error||'โหลดข้อมูลไม่ได้');ORDERS=d.orders||[];renderOrders()}catch(e){el.textContent=e.message}}
function renderOrders(){const el=document.querySelector('#orders');if(!ORDERS.length){el.innerHTML='<p>ยังไม่มีคำสั่งซื้อ</p>';return}el.innerHTML=ORDERS.map(o=>`<article class="order-card"><h2>ออเดอร์ ${esc(o.orderId)}</h2><p>${esc(o.customer)} · ${esc(o.phone)}</p><p>${esc(o.address)}</p><p><b>รายการสินค้า</b></p>${(o.items||[]).map(x=>`<p>□ ${esc(x.product)} (${esc(x.sku)}) × ${x.qty} = ฿${x.qty*x.unitPrice}</p>`).join('')}<h3>ยอดรวม ฿${o.total}</h3><div class="admin-actions"><select id="status-${esc(o.orderId)}"><option ${o.status==='รอหยิบสินค้า'?'selected':''}>รอหยิบสินค้า</option><option ${o.status==='กำลังแพ็ค'?'selected':''}>กำลังแพ็ค</option><option ${o.status==='พร้อมจัดส่ง'?'selected':''}>พร้อมจัดส่ง</option><option ${o.status==='จัดส่งแล้ว'?'selected':''}>จัดส่งแล้ว</option></select><input id="track-${esc(o.orderId)}" placeholder="เลขพัสดุ / Tracking No." value="${esc(o.trackingNo)}"><input id="carrier-${esc(o.orderId)}" placeholder="ขนส่ง" value="${esc(o.carrier)}"><button class="primary" onclick="saveOrder('${esc(o.orderId)}')">บันทึกสถานะ</button><button class="primary" onclick="printLabel('${esc(o.orderId)}')">พิมพ์ใบแพ็คและจ่าหน้า</button></div></article>`).join('')}
async function saveOrder(id){const body={action:'updateOrder',pin:document.querySelector('#pin').value,orderId:id,status:document.querySelector('#status-'+id).value,trackingNo:document.querySelector('#track-'+id).value,carrier:document.querySelector('#carrier-'+id).value};let r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)}),d=await r.json();if(!d.ok){alert(d.error||'บันทึกไม่สำเร็จ');return}alert('บันทึกแล้ว');loadOrders()}
function printLabel(id){const o=ORDERS.find(x=>x.orderId===id);if(!o)return;const area=document.createElement('div');area.className='print-area';area.innerHTML=`<div class="label-box"><h2>SOAP-SAA · ใบจัดเตรียมและจ่าหน้าพัสดุ</h2><p><b>เลขที่คำสั่งซื้อ:</b> ${esc(o.orderId)}</p><hr><h3>ผู้รับ</h3><h2>${esc(o.customer)}</h2><p>${esc(o.phone)}</p><p>${esc(o.address)}</p><hr><h3>รายการหยิบสินค้า</h3>${(o.items||[]).map(x=>`<p>□ ${esc(x.product)} (${esc(x.sku)}) × ${x.qty}</p>`).join('')}<hr><p><b>ยอดรวม:</b> ฿${o.total}</p><p><b>ขนส่ง:</b> ${esc(o.carrier||'________________')}</p><p><b>เลขพัสดุ:</b> ${esc(o.trackingNo||'________________')}</p><p>ผู้แพ็ค: __________________ วันที่: ______________</p></div>`;document.body.appendChild(area);window.print();area.remove()}
</script></body></html>
